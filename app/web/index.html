<!DOCTYPE html>
<html lang="es">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Aletheia: lector bíblico con catálogo local de dominio público, notas, referencias cruzadas y búsqueda sin conexión.">
  <meta name="theme-color" content="#00042F">
  <meta name="color-scheme" content="light dark">

  <!-- iOS / PWA meta tags -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Aletheia">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">

  <title>Aletheia — lector bíblico</title>

  <style>
    html,
    body {
      margin: 0;
      height: 100%;
      background: #00042f;
      color: #f7e9c8;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }

    #splash {
      position: fixed;
      inset: 0;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.65rem;
      padding: 1.5rem;
      text-align: center;
      background:
        radial-gradient(circle at 50% 42%, rgba(38, 54, 111, 0.45), transparent 42%),
        #00042f;
    }

    .splash-mark {
      display: grid;
      place-items: center;
      width: 6rem;
      height: 6rem;
      margin-bottom: 0.35rem;
      border: 2px solid #c9a85c;
      border-radius: 1.25rem;
      font-family: "Liberation Serif", Georgia, serif;
      font-size: 3.75rem;
      line-height: 1;
      color: #f7e9c8;
    }

    #splash h1 {
      margin: 0;
      font-family: "Liberation Serif", Georgia, serif;
      font-size: 2rem;
      font-weight: 400;
      letter-spacing: 0.03em;
    }

    #splash p {
      margin: 0;
      font-size: 0.9rem;
      color: #b9bfd8;
    }

    .splash-progress {
      width: 7rem;
      height: 2px;
      margin-top: 1.4rem;
      overflow: hidden;
      background: rgba(201, 168, 92, 0.25);
    }

    .splash-progress span {
      display: block;
      width: 45%;
      height: 100%;
      background: #c9a85c;
      animation: loading 1.4s ease-in-out infinite;
    }

    @keyframes loading {
      from { transform: translateX(-110%); }
      to { transform: translateX(330%); }
    }

    @media (prefers-reduced-motion: reduce) {
      .splash-progress span { animation: none; }
    }
  </style>
</head>
<body>
  <div id="splash" role="status" aria-live="polite">
    <div class="splash-mark" aria-hidden="true">Α</div>
    <h1>Aletheia</h1>
    <p>Lector bíblico · catálogo local</p>
    <div class="splash-progress" aria-hidden="true"><span></span></div>
  </div>
  <noscript>Activa JavaScript para usar Aletheia.</noscript>

  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
  <script>
    // La pantalla de carga desaparece cuando Flutter pinta el primer frame.
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('splash');
      if (splash) splash.remove();
    });

    // PWA: cachea el shell y el catálogo de aletheia-mods. Si el navegador no
    // soporta service workers, la app sigue funcionando con la red normal.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function () {});
      });
    }
  </script>
</body>
</html>
