name: Escritorio

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/desktop.yml'
  pull_request:
    paths:
      - 'app/**'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.7'

jobs:
  linux:
    name: Linux · analyze, tests y build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - name: Instalar dependencias de Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Dependencias
        run: flutter pub get
      - name: Análisis
        run: flutter analyze
      - name: Pruebas
        run: flutter test
      - name: Build Linux
        run: flutter build linux --release

  windows:
    name: Windows · build
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Dependencias
        run: flutter pub get
      - name: Pruebas
        run: flutter test
      - name: Build Windows
        run: flutter build windows --release

  macos:
    name: macOS · build
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Dependencias
        run: flutter pub get
      - name: Pruebas
        run: flutter test
      - name: Build macOS
        run: flutter build macos --release
